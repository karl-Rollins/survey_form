<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width-device-width, initial-scale-1.0" />
    <title>survey-form</title>
  </head>
  <body>
    <header>
      <div style="text-align: center">
        <h1 style="margin-bottom: 0">freeCodeCamp Survey Form</h1>
        <p style="margin-top: 0">
          Thank you for taking the time to help us improve the platform
        </p>
      </div>
    </header>
    <main>
      <div
        class="wrapper"
        style="padding-left: 450px; padding-right: 450px; padding-top: 50px"
      >
        <form class="centered-form">
          <label for="username">Name</label>
          <br />
          <input
            type="text"
            id="username"
            style="width: 100%; box-sizing: border-box"
            name="username"
            placeholder="Enter your name"
          />
          <br />
          <br />
          <label for="username">Email</label>
          <br />
          <input
            type="email"
            style="width: 100%; box-sizing: border-box"
            name="username"
            placeholder="Enter your email"
          />
          <br />
          <br />
          <label for="username">Age (optional)</label>
          <br />
          <input
            type="number"
            style="width: 100%; box-sizing: border-box"
            name="username"
            placeholder="Age"
          />
          <br />
          <br />
          <label for="username"
            >Which option best describe your current role?</label
          >
          <br />
          <select
            name="username"
            style="width: 100%; box-sizing: border-box"
          >
            <option value="" disabled selected hidden>
              Select current role
            </option>
            <option>Beginner</option>
            <option>Intermediate</option>
            <option>Junior Developer</option>
            <option>Senior Developer</option>
          </select>
          <br />
          <br />
          <label for="username"
            >Would you recommend freeCodeCamp to a friend</label
          >
          <br />
          <input
            type="radio"
            name="username"
            value="definitely"
          />
          <label for="Definitely">Definitely</label>
          <br />

          <input type="radio" name="username" value="maybe" />
          <label for="Maybe">Maybe</label><br />

          <input type="radio" name="username" value="not_sure" />
          <label for="not sure">Not sure</label>
          <br />
          <br />

          <label for="username"
            >What is your favorite feature of freeCodeCamp?</label
          >
          <br />
          <select
            name="username"
            style="width: 100%; box-sizing: border-box"
          >
            <option value="" disabled selected hidden>Select an option</option>
            <option>Interactive Coding Lessons</option>
            <option>Project-Based Certification</option>
            <option>Built-in Code Editor</option>
            <option>Step-by-Step Curriculum</option>
          </select>
          <br />
          <br />
          <label for="username"
            >What would you like to see improved? (check all that apply)</label
          >
          <br />
          <input
            type="checkbox"
            name="username"
            value="username"
          />
          <label for="username">Front-end Projects</label>
          <br />
          <input
            type="checkbox"
            name="username"
            value="username"
          />
          <label for="username">Back-end Projects</label>
          <br />
          <input
            type="checkbox"
            name="username"
            value="username"
          />
          <label for="username">Data Visualization</label>
          <br />
          <input
            type="checkbox"
            name="username"
            value="username"
          />
          <label for="username">Challenges</label>
          <br />
          <input
            type="checkbox"
            name="username"
            value="username"
          />
          <label for="username">Open Source Community</label>
          <br />
          <input
            type="checkbox"
            name="username"
            value="username"
          />
          <label for="username">Gitter help rooms</label>
          <br />
          <input
            type="checkbox"
            name="username"
            value="username"
          />
          <label for="username">videos</label>
          <br />
          <input
            type="checkbox"
            name="username"
            value="username"
          />
          <label for="username">City Meetups</label>
          <br />
          <input
            type="checkbox"
            name="username"
            value="username"
          />
          <label for="username">Wiki</label>
          <br />
          <input
            type="checkbox"
            name="username"
            value="username"
          />
          <label for="username">Forum</label>
          <br />
          <input
            type="checkbox"
            name="username"
            value="username"
          />
          <label for="username">Additional Courses</label>
          <br />
          <br />
          <label for="username">Any comments or suggestions?</label>
          <br />
          <textarea
            style="width: 100%; box-sizing: border-box; height: 100px"
            name="username"
            placeholder="Enter your comments here"
          ></textarea>
          <br />
          <br />
          <button type="submit" style="width: 100%; box-sizing: border-box">
            Submit
          </button>
        </form>
      </div>
    </main>
  </body>
</html>
